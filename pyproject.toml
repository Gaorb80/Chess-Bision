[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "chessbision"
version = "0.1.0"
description = "In phiếu bài tập cờ vua (PDF) từ study Lichess hoặc file PGN"
readme = "README.md"
requires-python = ">=3.11"
license = "GPL-3.0-or-later"
dependencies = ["chess>=1.10", "typst>=0.13"]

[project.optional-dependencies]
test = ["pytest>=8", "pypdf>=4"]

[project.scripts]
chessbision = "chessbision.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
chessbision = ["tai_nguyen/quan/*.svg", "tai_nguyen/phong/*"]
